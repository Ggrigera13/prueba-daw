<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Buscaminas - ¡Juega ahora!</title>
        <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="styles/style.css">
        <link rel="stylesheet" href="styles/contacto.css">
    </head>
    <body>
        <header>
            <h1>🔥Buscaminas🔥</h1>
            <p>Contacto</p>
        </header>
        <main>
            <section>
                <div class="juego">
                    <form id="formularioContacto" class="formulario-contacto">
                        <div>
                          <label for="nombre" class="label-contacto">Nombre:</label>
                          <input type="text" id="nombre" name="nombre">
                          <div class="error" id="errorNombre"></div>
                        </div>
                    
                        <div>
                          <label for="email" class="label-contacto">Correo electrónico:</label>
                          <input type="email" id="email" name="email">
                          <div class="error" id="errorEmail"></div>
                        </div>
                    
                        <div>
                          <label for="mensaje" class="label-contacto">Mensaje:</label>
                          <textarea id="mensaje" name="mensaje" rows="5"></textarea>
                          <div class="error" id="errorMensaje"></div>
                        </div>
                    
                        <button type="submit">Enviar</button>
                    </form>
                </div>
            </section>
        </main>
        
        <footer>

        </footer>

        <script src="scripts/contacto.js"></script>
    </body>
</html>
